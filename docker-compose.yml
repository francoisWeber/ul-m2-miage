  #     echo 'MinIO initialization complete';
  #     "

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: adminer
    profiles: [mysql]
    ports:
      - "8089:8080"
    networks:
      - dataeng-network
    depends_on:
      - mysql
    environment:
      - ADMINER_DEFAULT_SERVER=mysql

networks:
  dataeng-network:
    driver: bridge

volumes:
  jupyterhub_data:
  jupyterhub_home:  # Persistent home directories for users
  mysql_data:
  spark_master_data:
  spark_worker_1_data:
  spark_worker_2_data:
  qdrant_data:
  vespa_data:
  redis_data:
  # minio_data:

