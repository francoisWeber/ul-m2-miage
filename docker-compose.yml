services:
  # JupyterHub - Main entry point for students
  jupyterhub:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile
    container_name: jupyterhub
    ports:
      - "8000:8000"
    environment:
      - DOCKER_NETWORK_NAME=${COMPOSE_PROJECT_NAME}_default
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VESPA_HOST=vespa
      - VESPA_PORT=8080
      - SPARK_MASTER=spark://spark-master:7077
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY}
    volumes:
      - jupyterhub_home:/home              # User home directories (persistent, RW for each user)
      - jupyterhub_data:/srv/jupyterhub    # JupyterHub state and database
      - ./notebooks:/shared/notebooks:ro   # Shared notebooks (read-only template)
      - ./beer-dataset:/shared/data:ro     # Shared dataset (read-only)
      - ./jupyterhub/users.txt:/srv/jupyterhub/users.txt:ro
      - ./jupyterhub:/host/jupyterhub:rw   # Mount for writing passwords file back to host
    # Run as root to allow user creation (required for LocalProcessSpawner)
    user: "0:0"
    networks:
      - dataeng-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    profiles: [mysql]
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./beer-dataset/sql:/docker-entrypoint-initdb.d:ro
      - ./scripts/mysql:/scripts:ro
    networks:
      - dataeng-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Master
  spark-master:
    image: apache/spark:python3
    container_name: spark-master
    profiles: [spark]
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master port
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./beer-dataset:/opt/spark-data
      - spark_master_data:/opt/spark/work
    networks:
      - dataeng-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master -h spark-master

  # Spark Worker 1
  spark-worker-1:
    image: apache/spark:python3
    container_name: spark-worker-1
    profiles: [spark]
    ports:
      - "8081:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./beer-dataset:/opt/spark-data
      - spark_worker_1_data:/opt/spark/work
    networks:
      - dataeng-network
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 -m 2G -c 2

  # Spark Worker 2
  spark-worker-2:
    image: apache/spark:python3
    container_name: spark-worker-2
    profiles: [spark]
    ports:
      - "8082:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./beer-dataset:/opt/spark-data
      - spark_worker_2_data:/opt/spark/work
    networks:
      - dataeng-network
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 -m 2G -c 2

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    profiles: [qdrant]
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dataeng-network

  # Vespa Search Engine
  vespa:
    image: vespaengine/vespa:8
    container_name: vespa
    profiles: [vespa]
    ports:
      - "8088:8080"  # Vespa query/feed
      - "19071:19071" # Vespa config
      - "19092:19092" # Vespa metrics
    volumes:
      - vespa_data:/opt/vespa/var
      - ./vespa-config:/app:ro
    networks:
      - dataeng-network
    environment:
      - VESPA_CONFIGSERVERS=vespa

  # Redis In-Memory Store
  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: [redis]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dataeng-network
    command: redis-server --appendonly yes

